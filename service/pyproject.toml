[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collectorvision-service"
version = "0.1.0"
description = "Card identification HTTP service built on CollectorVision"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "collectorvision[hf]",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
cv-catalog = "collectorvision_service.local_catalog:main"

[project.optional-dependencies]
dev = ["pytest", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["collectorvision_service*"]

[tool.pytest.ini_options]
markers = ["hf: tests that download the MTG catalog from Hugging Face"]
